apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: rabbitmq
      tier: app
  template:
    metadata:
      name: rabbitmq
      labels:
        project: roboshop
        component: rabbitmq
        tier: app
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        envFrom:
          - secretRef:
              name: rabbitmq-secret
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: rabbitmq
    tier: app
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672
---
apiVersion: v1 
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: app
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: "cm9ib3Nob3A="
  RABBITMQ_DEFAULT_PASS: "cm9ib3Nob3AxMjM="