apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: frontend
      tier: web
  template:
    metadata:
      name: frontend
      labels:
        project: roboshop
        component: frontend
        tier: web
    spec:
      containers:
      - name: frontend
        image: koti0120/web:v1
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    component: frontend
    tier: web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
