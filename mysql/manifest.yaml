apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: db
  template:
    metadata:
      name: mysql
      labels:
        project: roboshop
        component: mysql
        tier: db
    spec:
      containers:
      - name: mysql
        image: koti0120/mysql:v1
        envFrom:
          - secretRef:
              name: mysql-secret
---
apiVersion: v1 
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: db
spec:
  selector:
    project: roboshop
    component: mysql
    tier: db
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: db
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: Um9ib1Nob3BAMQ==