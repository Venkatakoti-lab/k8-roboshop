apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: payment
      tier: app
  template:
    metadata:
      name: payment
      labels:
        project: roboshop
        component: payment
        tier: app
    spec:
      containers:
      - name: payment
        image: koti0120/payment:v1
        envFrom:
          - configMapRef:
              name: payment-config
          - secretRef:
              name: payment-secret
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: payment
    tier: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namepspace: roboshop
  labels:
    project: roboshop
    component: payment
    tier: app
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  
---
apiVersion: v1
kind: Secret
namespace:
  name: payment-secret
  namespace: roboshop
  labels:
    project: roboshop
    component: payment
    tier: app
type: Opaque
data:
  AMQP_USER: "cm9ib3Nob3A="
  AMQP_PASS: "cm9ib3Nob3AxMjM="
