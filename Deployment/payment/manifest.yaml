apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: payment
      tier: db
  template:
    metadata:
      labels:
        project: roboshop
        component: payment
        tier: db
    spec:
      containers:
      - name: payment
        image: koti0120/payment:v1
        envFrom:
          - configMapRef:
              name: payment
          - secretRef:
              name: payment
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: payment
    tier: db
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672
---
apiVersion: v1
kind: Secret
metadata:
  name: payment
  namespace: roboshop
data:
  payment_DEFAULT_USER: "cm9ib3Nob3A="
  payment_DEFAULT_PASS: "cm9ib3Nob3AxMjM="

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
