apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: user
      tier: app
  template:
    metadata:
      name: user
      labels:
        project: roboshop
        component: user
        tier: app
    spec:
      containers:
      - name: user
        image: koti0120/user:v1
        envFrom:
          - configMapRef:
              name: user-config

---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: user
    tier: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: v1 
kind: ConfigMap
metadata:
  name: user-config
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    tier: app
data:
  MONGO: "true"
  REDIS_URL= "redis://redis:6379"
  MONGO_URL= "mongodb://mongodb:27017/users"
